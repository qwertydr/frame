<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Vimeo Player</title>

    <!-- Plyr CSS CDN -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        .player-wrapper {
            max-width: 800px;
            margin: 40px auto;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #000;
        }

        /* 
           Vimeo-এর টপ বার (যেখানে টাইটেল ও সোর্স লিঙ্ক থাকে) 
           এবং প্লেয়ারের ওপর যেকোনো ক্লাইক প্রতিরোধ করে লোগো হাইড করার ট্রিক
        */
        .plyr__video-embed iframe {
            top: -50px !important;
            height: calc(100% + 100px) !important;
            pointer-events: none; /* মাউস ক্লিক ব্লক করা যাতে Vimeo-তে রিডাইরেক্ট না হয় */
        }
    </style>
</head>
<body>

<div class="player-wrapper">
    <!-- আপনার Vimeo Video ID-টি "plyr__video-embed" ডাটা এট্রিবিউটে বসান -->
    <div class="plyr__video-embed" id="player">
        <iframe
            src="https://player.vimeo.com/video/1218544841?loop=false&amp;byline=false&amp;portrait=false&amp;title=false&amp;speed=true&amp;transparent=0&amp;gesture=media"
            allowfullscreen
            allowtransparency
            allow="autoplay"
        ></iframe>
    </div>
</div>

<!-- Plyr JS CDN -->
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
    // Plyr Custom Player Initialize
    const player = new Plyr('#player', {
        controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
        vimeo: {
            byline: false,
            portrait: false,
            title: false,
            speed: true,
            transparent: false
        }
    });
</script>

</body>
</html>
