<!doctype html><html lang="en"><head>

	<script>
  (function() {
    // 1. Detect Automated Webdrivers / Headless Browsers
    const isBot = navigator.webdriver || 
                  /HeadlessChrome|PhantomJS|Selenium|puppeteer|playwright|bot|crawler|spider|curl|wget|python/i.test(navigator.userAgent) ||
                  window.__nightmare || window.callPhantom;

    // 2. Action: If a Bot/Script is detected, stop execution & clear page
    if (isBot) {
      window.stop();
      document.documentElement.innerHTML = "<h1>Access Denied: Automated Access Not Allowed</h1>";
    }
  })();
</script>
